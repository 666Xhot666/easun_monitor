; ESP32 RS232 proxy between the inverter and its Wi-Fi plug.
[platformio]
default_envs = proxy

[esp32]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200

; The proxy itself: pio run -e proxy -t upload
[env:proxy]
extends = esp32
monitor_speed = 460800
build_src_filter = +<*>

; Blinks the LED and echoes what arrives over USB.
[env:echo]
extends = esp32
build_src_filter = +<../bench/echo.cpp>

; Sends test frames out of UART2 through an SP3232 with its RS232 TX and RX shorted.
[env:loopback]
extends = esp32
build_src_filter = +<../bench/loopback.cpp>

; Unit tests of the firmware's logic on this computer: pio test -e native
[env:native]
platform = native
test_framework = unity

; Fake inverter and fake Wi-Fi plug for testing the proxy on the bench.
[env:rig]
extends = esp32
build_src_filter = +<../bench/rig.cpp>
