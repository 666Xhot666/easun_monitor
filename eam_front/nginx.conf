server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Reverse-proxy API calls to the backend container over the compose
    # network — mirrors vite.config.ts's dev-server proxy, which only
    # applies to `npm run dev` and has no effect on this production,
    # nginx-served build. Without this block the built app's /api/* fetch
    # calls would 404 (falling through to the SPA fallback below).
    location /api/ {
        proxy_pass http://server:3000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Single-page app: let React Router (or similar) handle client-side routes.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Long-cache immutable, content-hashed build assets.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
}
